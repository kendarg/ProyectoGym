<main>
  <section class="hero-carousel" id="Inicio" aria-roledescription="carrusel" aria-label="Promociones de Ultra Fitness">
    @for (slide of slides; track slide.image; let index = $index) {
      @if (currentSlide() === index) {
        <article class="hero-slide">
          <img class="hero-image" [src]="slide.image" [alt]="slide.alt">
          <div class="hero-content">
            <p class="hero-eyebrow">{{ slide.eyebrow }}</p>
            <h1>{{ slide.title }}</h1>
            <p class="hero-description">{{ slide.description }}</p>
            <a class="hero-cta" [href]="slide.href">{{ slide.cta }} <span aria-hidden="true">→</span></a>
          </div>
        </article>
      }
    }

    <div class="hero-controls" aria-label="Controles del carrusel">
      <button class="hero-arrow" type="button" aria-label="Diapositiva anterior" (click)="previousSlide()">
        <span aria-hidden="true">‹</span>
      </button>
      <div class="hero-dots" aria-label="Elegir diapositiva">
        @for (slide of slides; track slide.image; let index = $index) {
          <button
            class="hero-dot"
            [class.is-active]="currentSlide() === index"
            [attr.aria-label]="'Ir a la diapositiva ' + (index + 1)"
            [attr.aria-current]="currentSlide() === index ? 'true' : null"
            type="button"
            (click)="goToSlide(index)"
          ></button>
        }
      </div>
      <button class="hero-arrow" type="button" aria-label="Diapositiva siguiente" (click)="nextSlide()">
        <span aria-hidden="true">›</span>
      </button>
    </div>
  </section>
</main>
